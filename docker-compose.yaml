services:
  api:
    build: .
    ports:
      - "${PORT}:${PORT}"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - image-tagger-images:/app/data/images
      - .:/app:z
      - /app/node_modules
  db:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: it_123
      POSTGRES_DB: image_tagger
    volumes:
      - image-tagger-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d image_tagger"]
      interval: 2s
      timeout: 5s
      retries: 5

volumes:
  image-tagger-db:
  image-tagger-images:
